<!DOCTYPE html>
<html lang="en">
    <meta charset="utf-8">
    <title>Life Companion</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
    crossorigin="anonymous">
    </script>
    <body>
        <main class="splash screen">
            <div class="logo">
                <div class="logo-life">Life</div>
                <div class="logo-companion">Companion</div>
            </div>

            <h1 class="daily-prompt">
                Ready to Start the Day?
            </h1>

            <div class="begin-wrapper">
                <span class="pulse pulse-1"></span>
                <span class="pulse pulse-2"></span>
                <span class="pulse pulse-3"></span>
                <button class="begin-button">
                    Begin!
                </button>
            </div>
        </main>
    </body>
</html>
